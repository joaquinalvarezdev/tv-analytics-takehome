server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mirrors proxy.conf.json used by `ng serve` in local dev: the SPA calls
    # relative /api/... URLs, and this container forwards them to the API
    # container on the compose network. `api` is the compose service name;
    # 8080 is the API's in-container port (see ASPNETCORE_URLS in
    # backend/Dockerfile and docker-compose.yaml).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing fallback for the Angular SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
